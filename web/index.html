<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisor do Fechamento</title>
<style>
:root{
  --navy:#212E50; --navy2:#1A234B; --azul:#2F5CA6; --azul-claro:#79ADE0; --palido:#E9F0F9;
  --bg:#F3F5F8; --painel:#FFFFFF; --borda:#D5DAE3; --borda2:#E6E9EF; --texto:#1C2333; --suave:#5B6478; --fraco:#8A93A6;
  --erro:#B42318; --erro-bg:#FDECEA; --erro-bd:#F4C7C2;
  --alerta:#9A5B00; --alerta-bg:#FEF4E2; --alerta-bd:#F3D6A4;
  --ok:#1E7B3C; --ok-bg:#E7F4EA; --ok-bd:#BFE0C8;
  --cinza-bg:#EEF0F4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--texto);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:52px;position:sticky;top:0;z-index:20}
.top img{height:26px}
.top .nome{font-weight:600;font-size:15px;letter-spacing:.2px;padding-left:16px;border-left:1px solid rgba(255,255,255,.25)}
.top .emp{margin-left:auto;text-align:right;font-size:12px;line-height:1.3;opacity:.92}
.top .emp b{font-size:13px}
.abas{background:#fff;border-bottom:1px solid var(--borda);display:flex;flex-wrap:wrap;gap:0;padding:0 20px;position:sticky;top:52px;z-index:19}
.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px 9px;color:var(--suave);font-weight:600}
.abas button.on{color:var(--navy);border-bottom-color:var(--azul)}
.abas button:disabled{opacity:.4;cursor:default}
.abas .dir{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
main{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.tit{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:4px 0 10px;display:flex;align-items:center;gap:10px}
.tit small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--suave);font-size:12px}
.painel{background:var(--painel);border:1px solid var(--borda);border-radius:4px}
.btn{border:1px solid var(--borda);background:#fff;color:var(--navy);border-radius:4px;padding:6px 12px;font-weight:600}
.btn:hover{border-color:var(--azul)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.pri:hover{background:#264d8c}
.btn.grande{padding:11px 34px;font-size:15px}
.btn.peq{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--azul);padding:0;font-weight:600}
.lnk.perigo{color:var(--erro)}

/* parâmetros */
.params{display:flex;gap:18px;align-items:flex-end;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.params label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
.params input{border:1px solid var(--borda);border-radius:4px;padding:7px 9px;font:inherit;font-size:13px;width:200px;color:var(--texto)}
.params input:focus{outline:2px solid var(--azul-claro);border-color:var(--azul)}
.params .dica{color:var(--fraco);font-size:12px;padding-bottom:8px}

/* cards de importação */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{display:flex;flex-direction:column}
.card .cab{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--borda2)}
.card .cab .t{font-weight:700;color:var(--navy);font-size:13.5px}
.card .cab .s{color:var(--suave);font-size:12px}
.card .cab .qtd{margin-left:auto;font-weight:700;font-size:12px;border-radius:3px;padding:2px 8px;background:var(--cinza-bg);color:var(--suave);white-space:nowrap}
.drop{margin:10px 12px;border:1.5px dashed #BFC7D6;border-radius:4px;padding:14px 10px;text-align:center;color:var(--suave);cursor:pointer;transition:background .12s,border-color .12s;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:78px}
.drop:hover,.drop.over{background:var(--palido);border-color:var(--azul);color:var(--navy)}
.drop b{color:var(--navy)}
.drop .ext{font-size:11.5px;color:var(--fraco);margin-top:2px}
.card .rod{display:flex;gap:12px;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--suave);min-height:24px}
.card .rod .esp{margin-left:auto;display:flex;gap:12px}
.lista{border-top:1px solid var(--borda2);max-height:170px;overflow:auto;font-size:12px;display:none}
.lista.on{display:block}
.lista div{display:flex;gap:8px;padding:3px 12px;border-bottom:1px solid var(--borda2)}
.lista div span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista div button{background:none;border:0;color:var(--fraco);padding:0 2px}
.lista div button:hover{color:var(--erro)}
.card.ref{grid-column:1 / -1;border-color:var(--azul)}
.card.ok{border-color:var(--ok-bd)}
.card .cab .qtd.tem{background:var(--ok-bg);color:var(--ok)}
.check{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;font-weight:700;flex:0 0 18px}
.vazio-ck{display:inline-block;width:18px;height:18px;border-radius:50%;border:1.5px solid #C7CCD6;flex:0 0 18px}
.drop.recebido{border-color:var(--ok-bd);background:#F6FBF7}
.drop.recebido b{color:var(--ok)}
.ap.feito{opacity:.55}
.ap.feito .tt{text-decoration:line-through}
.btn-ok{border:1px solid var(--ok-bd);background:#fff;color:var(--ok);border-radius:4px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.btn-ok:hover{background:var(--ok-bg)}
.btn-ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tag.corrigida{color:var(--ok);background:#fff;border-color:var(--ok-bd)}
.dot.corrigida{background:#fff;border:2px solid #3E9B5B;width:10px;height:10px}
.kpi.corr{border-top:3px solid #9CCBAA} .kpi.corr .v{color:var(--ok)}
.det-acoes{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ap .cat{display:inline-block;font-size:10px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.ap .tb{font-size:11.5px;color:var(--suave);margin-top:3px}
.ap .tb b{color:var(--navy);font-weight:600}
.ap .pq{font-size:11.5px;color:#5B6478;margin-top:4px;padding-left:8px;border-left:2px solid #C9D8EE}
.ap .just{grid-column:2 / -1;background:#F6FBF7;border:1px solid var(--ok-bd);border-radius:4px;padding:6px 10px;font-size:12px;color:#1E4D2B}
.ap .jform{grid-column:2 / -1;display:flex;gap:8px;align-items:flex-start}
.ap .jform textarea,.obs-nota textarea{flex:1;font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:6px 8px;min-height:44px;resize:vertical}
.btns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.btn-just{border:1px solid #D0D5DE;background:#fff;color:var(--navy);border-radius:4px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.btn-just:hover{border-color:var(--azul)} .btn-just.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ck{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px;font-size:12px}
.ck .t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);margin-right:4px}
.ck span.p{border:1px solid;border-radius:3px;padding:1px 7px;font-weight:600;font-size:11.5px}
.ck .ok{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)} .ck .erro{color:var(--erro);border-color:var(--erro-bd);background:var(--erro-bg)}
.ck .alerta{color:var(--alerta);border-color:var(--alerta-bd);background:var(--alerta-bg)} .ck .nao{color:var(--fraco);border-color:#D6DAE2;border-style:dashed}
.ck .resolvido{color:var(--ok);border-color:var(--ok-bd)}
.obs-nota{display:flex;gap:8px;align-items:flex-start;margin:10px 0 12px}
.obs-nota label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);padding-top:6px;white-space:nowrap}
.rk-cat{padding:6px 12px 3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);background:#FAFBFC;border-bottom:1px solid var(--borda2);display:flex;justify-content:space-between;cursor:pointer}
.rk-cat.sel{background:var(--palido)}
.apu-kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
.apu-kpis .kpi{cursor:default}
.apu-kpis .kpi .v.pagar{color:var(--erro)} .apu-kpis .kpi .v.credor{color:var(--ok)}
table.apu{font-variant-numeric:tabular-nums}
table.apu th{text-align:right} table.apu th:first-child,table.apu th:nth-child(2){text-align:left}
table.apu td{padding:6px 10px;border-bottom:1px solid var(--borda2);white-space:nowrap}
table.apu tr.grp td{background:var(--palido);color:var(--navy);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 10px}
table.apu tr.cf{cursor:pointer} table.apu tr.cf:hover td{background:#F7F9FC}
table.apu tr.cf td:first-child{font-weight:700;color:var(--navy)}
table.apu tr.cf .tg{display:inline-block;width:14px;color:var(--fraco);transition:transform .15s}
table.apu tr.cf.on .tg{transform:rotate(90deg);color:var(--azul)}
table.apu tr.cf.on td{background:#F4F7FC}
table.apu tr.cs td{background:#FBFCFE;color:var(--suave);font-size:12px;padding:4px 10px}
table.apu tr.cs td:first-child{padding-left:34px}
table.apu tr.tot td{font-weight:700;background:#F3F5F8;border-top:1px solid var(--borda);border-bottom:2px solid var(--borda)}
table.apu td.dsc{color:var(--suave);max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.apu-nota{font-size:12px;color:var(--suave);padding:8px 12px;border-top:1px solid var(--borda2)}
.aj{margin-bottom:12px}
.aj .ph{justify-content:space-between}
.aj .ph .tt{display:flex;gap:10px;align-items:baseline}
.aj .ph .val{font-variant-numeric:tabular-nums;font-size:15px;color:var(--navy)}
.aj .cfg{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--borda2);background:#FAFBFC}
.aj .cfg label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
.aj input[type=text],.aj input[type=number],.aj select{font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:5px 7px;color:var(--texto)}
.aj .cfg .desc{width:420px;max-width:100%} .aj .cfg .cod{width:130px;font-family:ui-monospace,Menlo,monospace}
.aj table td{padding:5px 10px;font-variant-numeric:tabular-nums}
.aj table td input.v{width:110px;text-align:right}
.aj table td input.d{width:100%;min-width:260px}
.aj table td input.c{width:120px;font-family:ui-monospace,Menlo,monospace}
.aj tr.fora td{color:var(--fraco)}
.aj .vz{padding:12px;color:var(--fraco)}
.detbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;color:var(--suave)}
.detbar b{color:var(--navy)}
table.xl td.x-in{padding:0} table.xl td.x-in input{width:100%;height:22px;border:0;background:#FFFDF2;font:inherit;text-align:right;padding:2px 6px;box-shadow:inset 0 0 0 1px #E8D9A8}
table.xl td.x-in input:focus{outline:2px solid #2F5CA6;background:#fff}
table.xl td.x-ed{box-shadow:inset 3px 0 0 #E0A23B} table.xl td.x-in.x-ed input{background:#FFF1C9;font-weight:700}
.xl-tabs{display:flex;gap:2px;border-bottom:2px solid #0E2841;margin-bottom:10px;flex-wrap:wrap}
.xl-tabs button{border:1px solid var(--borda);border-bottom:0;background:#F3F5F8;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--suave);border-radius:4px 4px 0 0}
.xl-tabs button.on{background:#0E2841;color:#fff;border-color:#0E2841}
.xl-wrap{overflow:auto;background:#fff;border:1px solid var(--borda);border-radius:4px;padding:12px}
table.xl{border-collapse:collapse;table-layout:fixed;font-size:12px;font-family:Calibri,Arial,sans-serif}
table.xl td{padding:3px 6px;border:0;overflow:hidden;white-space:normal;vertical-align:middle;height:22px}
table.xl td.c{border:1px solid #7F7F7F} table.xl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.xl td.xb{font-weight:700} table.xl td.x-tit,table.xl td.x-sub,table.xl td.x-cab{text-align:center;font-weight:700}
table.xl td.x-tit,table.xl td.x-totg{border:2px solid #0E2841} table.xl td.x-sub{border-top:2px solid #0E2841;border-bottom:2px solid #0E2841}
table.xl td.x-cod{border:0;color:#E00000;font-weight:700;font-size:10.5px;white-space:nowrap;overflow:visible} table.xl td.x-nota{border:0;color:#5B6478;font-style:italic;font-size:11px;white-space:nowrap;overflow:visible}
table.xl tr.vz td{height:10px}
.scp-kpis{grid-template-columns:repeat(6,1fr)} .scp-kpis .kpi{cursor:default}
.imp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--borda2)}
.imp-i{display:flex;gap:10px;align-items:center;padding:10px 12px;border-right:1px solid var(--borda2)} .imp-i:last-child{border-right:0}
.imp-i>span{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #C7CCD6;color:var(--fraco);font-size:11px}
.imp-i.ok>span{background:var(--ok);border-color:var(--ok);color:#fff} .imp-i .sb{font-size:11px;color:var(--fraco)}
table.mem td.fx{color:var(--suave);font-size:11.5px} table.mem tr.mt-tot td{font-weight:700;background:#FAFBFC;border-top:1px solid var(--borda)}
table.mem tr.mt-deb td:first-child{color:var(--erro)} table.mem tr.mt-cred td:first-child{color:var(--ok)} table.mem tr.mt-ret td:first-child{color:var(--azul)} table.mem tr.mt-saldo td{color:var(--suave);font-style:italic}
.crit{padding:10px 12px;display:grid;gap:8px;font-size:12.5px;color:var(--texto)} .tgs{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:6px;border-top:1px solid var(--borda2)}
label.tg{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--suave);font-weight:600}
.cfg-ref input[type=text],.cfg-ref select{font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:4px 6px}
.in-w{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:4px 6px} .in-n{width:120px;text-align:right;font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:4px 6px}
tr.fora td{color:var(--fraco)}
.sim{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:0}
.sim-c{padding:12px;border-right:1px solid var(--borda2);display:flex;flex-direction:column;gap:8px} .sim-c label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
.sim-c select{font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:5px 6px}
.sim-r{padding:12px;border-right:1px solid var(--borda2)} .sim-r:last-child{border-right:0} .sim-r input[type=range]{width:100%} .sim-t{font-size:12.5px;margin-bottom:6px}
.sim-p{font-size:12px;font-weight:700;color:var(--navy)} .sim-b{height:8px;background:#E7F4EA;border-radius:4px;overflow:hidden;margin-top:6px} .sim-b i{display:block;height:100%;background:var(--azul)}
.sim-v{display:flex;justify-content:space-between;font-size:11.5px;color:var(--suave);margin-top:4px}
.al-scp{padding:8px 12px;border-bottom:1px solid var(--borda2);font-size:12.5px} .al-scp:last-child{border-bottom:0}
@media (max-width:1000px){.scp-kpis{grid-template-columns:1fr 1fr}.imp-g{grid-template-columns:1fr 1fr}.sim{grid-template-columns:1fr}}
.bt-ev{height:8px} .bt-ev i{display:block;height:8px;background:var(--azul);border-radius:0 4px 4px 0}
.acoes{padding:8px 12px 12px;display:grid;gap:8px;font-size:12.5px} .acoes .sb{font-size:11px;color:var(--fraco);margin-top:2px}
.cfg-ref{display:flex;gap:14px;padding:10px 12px;border-bottom:1px solid var(--borda2);background:#FAFBFC}
.cfg-ref label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
.cfg-ref input{width:110px;font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:4px 6px}
.situacao{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--suave);margin-right:6px}
.situacao select{font:inherit;font-size:12px;border:1px solid var(--borda);border-radius:4px;padding:3px 6px}
.sit-p{display:inline-block;width:90px;height:6px;background:var(--borda2);border-radius:3px;overflow:hidden}
.sit-p i{display:block;height:100%;background:#3E9B5B}
.al-col{margin-top:6px;font-size:12px;padding:5px 8px;border-radius:4px;border:1px solid}
.al-col.erro{color:var(--erro);background:var(--erro-bg);border-color:var(--erro-bd)} .al-col.alerta{color:var(--alerta);background:var(--alerta-bg);border-color:var(--alerta-bd)}
details.prova{margin-top:6px;font-size:12px} details.prova summary{cursor:pointer;color:var(--azul);font-weight:600}
details.prova table{margin-top:4px;width:auto} details.prova td{padding:2px 10px 2px 0;border-bottom:1px solid var(--borda2)} details.prova td.cl{color:var(--fraco)}
.pend{padding:6px 12px 10px;display:grid;gap:6px;font-size:12.5px} .pend span{color:var(--fraco)} .pend .pi{color:var(--suave);font-size:12px;margin-top:2px}
.lote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--palido);border-bottom:1px solid #C9D8EE;font-size:12.5px}
.lote input{flex:1;min-width:240px;font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:5px 8px}
.rel-g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.rel-c{display:flex;flex-direction:column} .rel-s{padding:10px 12px;color:var(--suave);font-size:12.5px;flex:1}
.rel-o{display:flex;flex-direction:column;gap:6px;padding:0 12px 10px} .rel-o label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--suave);font-weight:600}
.rel-o select{font:inherit;font-size:12.5px;border:1px solid var(--borda);border-radius:4px;padding:4px 6px;min-width:180px}
.rel-b{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--borda2)}
.rel-t td{white-space:nowrap;font-size:12px;padding:4px 8px} .rel-t th{white-space:nowrap}
@media (max-width:1000px){.rel-g{grid-template-columns:1fr}}
table.apu tr.cs-nf td{background:#FBFCFE;padding:0 10px 6px;font-size:11.5px;color:var(--fraco);white-space:normal;border-bottom:1px solid var(--borda2);line-height:1.5}
table.apu tr.cs-nf .t{font-weight:700;color:var(--suave)}
.pn-kpis{grid-template-columns:repeat(5,1fr)}
.pn-kpis .kpi{cursor:default} .pn-kpis .kpi .v{font-size:19px}
.pn-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.pn-t td,.pn-t th{padding:6px 12px} .pn-t tr.sub td{color:var(--suave)} .pn-t tr.tot td{font-weight:700;border-top:1px solid var(--borda);background:#FAFBFC}
.pn-t .sb,.bars .sb{display:block;font-size:11px;color:var(--fraco);font-weight:400}
.bars{padding:6px 0}
.br{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:10px;align-items:center;padding:5px 12px}
.br:hover{background:#F7F9FC}
.br .bn{min-width:0;display:grid;grid-template-columns:20px 1fr;column-gap:4px}
.br .rk-n{color:var(--fraco);font-size:11px;font-variant-numeric:tabular-nums;padding-top:1px}
.br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--texto)}
.br .sb{grid-column:2}
.br .bt{height:8px;background:transparent;position:relative}
.br .bt i{display:block;height:8px;background:var(--azul);border-radius:0 4px 4px 0}
.br .bv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.br .bv span{display:block;font-size:11px;color:var(--fraco);font-weight:400}
.br.dm .nm{color:var(--suave);font-weight:400}
.sn-k{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--borda2)}
.sn-k div{padding:8px 12px;border-right:1px solid var(--borda2)} .sn-k div:last-child{border-right:0}
.sn-k b{display:block;font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums} .sn-k span{font-size:11px;color:var(--suave)}
.vz-p{padding:14px 12px;color:var(--fraco)}
@media (max-width:1000px){.pn-g2{grid-template-columns:1fr}.pn-kpis{grid-template-columns:1fr 1fr}.sn-k{grid-template-columns:1fr 1fr}}
.aj .sug{padding:8px 12px;border-top:1px dashed var(--borda);background:#FFFDF8}
.aj .sug .it{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:12px}
.aj .sug .it span.m{color:var(--fraco)}
.res-apu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.res-apu table td{padding:6px 12px}
.res-apu tr.sub td{color:var(--suave)}
.res-apu tr.tot td{font-weight:700;border-top:1px solid var(--borda)}
.res-apu .fim{display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:2px solid var(--borda)}
.res-apu .fim .r{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.res-apu .fim .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.res-apu .fim.pagar .r,.res-apu .fim.pagar .v{color:var(--erro)} .res-apu .fim.credor .r,.res-apu .fim.credor .v{color:var(--ok)}
.res-apu input{width:120px;text-align:right;font:inherit;border:1px solid var(--borda);border-radius:4px;padding:3px 6px}
@media (max-width:1000px){.res-apu{grid-template-columns:1fr}.apu-kpis{grid-template-columns:1fr 1fr}}

.nat{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;letter-spacing:.2px;border:1px solid}
.nat.dev_venda,.nat.dev_compra,.nat.dev_compra_forn{color:#5B3FA0;background:#F1ECFA;border-color:#D9CCF2}
.nat.cancelada{color:#4A5468;background:var(--cinza-bg);border-color:#D0D5DE;text-decoration:line-through}
.nat.inutilizada,.nat.numeracao{color:#4A5468;background:#fff;border-color:#C7CCD6;border-style:dashed}
.nat.complementar,.nat.ajuste{color:var(--azul);background:var(--palido);border-color:#C9D8EE}
.tres{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.bal td,.bal th{padding:6px 10px}
.bal tr.sub td{color:var(--suave)}
.bal tr.tot td{font-weight:700;border-top:1px solid var(--borda);background:#FAFBFC}
.lista-p{max-height:260px;overflow:auto}
.lista-p .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 12px;border-bottom:1px solid var(--borda2);cursor:pointer}
.lista-p .it:hover{background:#F7F9FC}
.lista-p .it small{color:var(--fraco);grid-column:1 / -1}
.lista-p .vz{padding:14px 12px;color:var(--fraco)}
.sec-p{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);padding:8px 12px 4px;background:#FAFBFC;border-bottom:1px solid var(--borda2)}
.devs tr{cursor:pointer} .devs tr:hover td{background:#F7F9FC}
@media (max-width:1000px){.tres{grid-template-columns:1fr}}
.card.ref .cab{background:var(--palido);border-bottom-color:#C9D8EE}
.card.ref .cab .t::before{content:"REFERÊNCIA";font-size:10px;letter-spacing:.6px;background:var(--azul);color:#fff;border-radius:2px;padding:1px 6px;margin-right:8px;vertical-align:1px}
.ref-corpo{display:grid;grid-template-columns:300px 1fr;gap:0}
.ref-corpo .drop{min-height:110px}
.abas-pl{padding:10px 14px 12px 4px;border-left:1px solid var(--borda2);margin:10px 0}
.abas-pl .vazio{color:var(--fraco);padding:24px 10px}
.aba-pl{padding:6px 10px 10px;border-bottom:1px solid var(--borda2)}
.aba-pl:last-child{border-bottom:0}
.aba-pl .l1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.aba-pl .l1 b{color:var(--navy)}
.aba-pl .l1 .m{color:var(--suave);font-size:12px}
.aba-pl .l1 .lnk{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;border:1px solid #C9D8EE;color:var(--azul);background:#fff;border-radius:3px;padding:1px 6px}
.chip.falta{border-style:dashed;border-color:#C7CCD6;color:var(--fraco)}
.chip.ruim{border-color:var(--erro-bd);color:var(--erro);background:var(--erro-bg)}
.mapa{margin-top:10px;border:1px solid var(--borda);border-radius:4px;display:none}
.mapa.on{display:block}
.mapa .topo{display:flex;gap:12px;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--borda);font-size:12px}
.mapa .topo input{width:60px;border:1px solid var(--borda);border-radius:3px;padding:3px 6px;font:inherit}
.mapa .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.mapa .grade label{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-bottom:1px solid var(--borda2);border-right:1px solid var(--borda2);font-size:11px;color:var(--suave);font-weight:600}
.mapa select{font:inherit;font-size:12px;border:1px solid var(--borda);border-radius:3px;padding:3px 4px;color:var(--texto);max-width:100%}
.mapa select.usado{border-color:var(--azul);background:var(--palido)}
.mapa .pe{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px}
.acao{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;justify-content:center}
.acao .msg{color:var(--suave)}
.acao .msg.erro{color:var(--erro);font-weight:600}
.prog{height:3px;background:var(--borda2);border-radius:2px;overflow:hidden;width:220px;display:none}
.prog i{display:block;height:100%;background:var(--azul);width:0;transition:width .2s}

/* resultado */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.kpi{padding:12px 16px;border-right:1px solid var(--borda2);cursor:pointer}
.kpi:last-child{border-right:0}
.kpi:hover{background:#FAFBFC}
.kpi .r{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:26px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--fraco)}
.kpi.erro .v{color:var(--erro)} .kpi.alerta .v{color:var(--alerta)} .kpi.ok .v{color:var(--ok)}
.kpi.erro{border-top:3px solid var(--erro)} .kpi.alerta{border-top:3px solid #E0A23B} .kpi.ok{border-top:3px solid #3E9B5B} .kpi.neutro{border-top:3px solid var(--navy)}
.duas{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:12px;margin-bottom:14px}
.painel .ph{padding:9px 12px;border-bottom:1px solid var(--borda);font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.painel .ph small{font-weight:500;color:var(--fraco)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);font-weight:700;text-align:left;padding:7px 10px;border-bottom:1px solid var(--borda);background:#FAFBFC;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--borda2);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov th,.mov td{padding:7px 8px}
.mov tr.l{cursor:pointer}
.mov tr.l:hover td{background:#F7F9FC}
.mov tr.sel td{background:var(--palido)}
.mov td b.e{color:var(--erro)} .mov td b.a{color:var(--alerta)} .mov td b.o{color:var(--ok)}
.mov .zero{color:#C2C8D3}
.dif.neg{color:var(--erro)} .dif.pos{color:var(--alerta)}
.rank{max-height:342px;overflow:auto}
.rk{display:grid;grid-template-columns:1fr 64px;gap:2px 10px;padding:7px 12px;border-bottom:1px solid var(--borda2);cursor:pointer;align-items:center}
.rk:hover{background:#F7F9FC}
.rk.sel{background:var(--palido)}
.rk .t{display:flex;gap:8px;align-items:center;min-width:0}
.rk .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rk .bar{grid-column:1 / -1;height:4px;background:var(--borda2);border-radius:2px;overflow:hidden}
.rk .bar i{display:block;height:100%}
.rk.erro .bar i{background:var(--erro)} .rk.alerta .bar i{background:#E0A23B}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 6px;letter-spacing:.2px;white-space:nowrap;border:1px solid}
.tag.erro{color:var(--erro);background:var(--erro-bg);border-color:var(--erro-bd)}
.tag.alerta{color:var(--alerta);background:var(--alerta-bg);border-color:var(--alerta-bd)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.tag.cancelada,.tag.info{color:var(--suave);background:var(--cinza-bg);border-color:#D6DAE2}

.filtros{display:flex;gap:14px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--borda);border-radius:4px;overflow:hidden}
.seg button{background:#fff;border:0;border-right:1px solid var(--borda);padding:5px 10px;color:var(--suave);font-size:12px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button .c{opacity:.7;font-weight:500;margin-left:3px}
.filtros select,.filtros input{font:inherit;font-size:12px;border:1px solid var(--borda);border-radius:4px;padding:5px 8px;color:var(--texto)}
.filtros input{width:220px}
.filtros .lim{margin-left:auto}
.notas td{cursor:pointer}
.notas tr.n:hover td{background:#F7F9FC}
.notas tr.n.aberta td{background:var(--palido);border-bottom-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-top:4px}
.dot.erro{background:var(--erro)} .dot.alerta{background:#E0A23B} .dot.ok{background:#3E9B5B} .dot.cancelada{background:#A5ADBB}
.part{max-width:250px}
.part .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.part .cn{color:var(--fraco);font-size:11.5px}
.aps{display:flex;flex-wrap:wrap;gap:4px;max-width:440px}
.seta{color:var(--fraco);width:16px;transition:transform .15s}
tr.aberta .seta{transform:rotate(90deg);color:var(--azul)}
.det td{background:#FBFCFE;padding:0;cursor:default}
.det .in{padding:12px 16px 16px 40px;border-bottom:2px solid var(--azul)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:var(--suave);margin-bottom:10px}
.meta b{color:var(--texto);font-weight:600}
.meta code{font:11.5px ui-monospace,Menlo,monospace;color:var(--texto)}
.ap-lista{border:1px solid var(--borda);border-radius:4px;background:#fff;margin-bottom:12px}
.ap{display:grid;grid-template-columns:76px minmax(240px,1.5fr) minmax(110px,.7fr) minmax(110px,.7fr) minmax(170px,1fr) 112px;gap:10px;padding:8px 10px;border-bottom:1px solid var(--borda2);align-items:start}
.ap:last-child{border-bottom:0}
.ap.cab{background:#FAFBFC;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);padding:5px 10px}
.ap .tt{font-weight:600}
.ap .dd{color:var(--suave);font-size:12px}
.ap .vx{font-variant-numeric:tabular-nums}
.ap .vs{font-variant-numeric:tabular-nums;font-weight:600}
.ap.erro .vs{color:var(--erro)} .ap.alerta .vs{color:var(--alerta)}
.ap .cr{color:var(--navy)}
.ap .cr::before{content:"→ ";color:var(--azul);font-weight:700}
.comp{border:1px solid var(--borda);border-radius:4px;background:#fff;overflow:auto}
.comp th{background:var(--bg);font-size:10.5px}
.comp td{font-variant-numeric:tabular-nums;white-space:nowrap;padding:5px 10px}
.comp tr.x td{border-bottom:0;color:var(--suave)}
.comp tr.s td{border-bottom:1px solid var(--borda)}
.comp tr:last-child td{border-bottom:0}
.comp td.lado{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;width:70px}
.comp tr.x td.lado{color:var(--azul)} .comp tr.s td.lado{color:var(--navy)}
.comp td.erro{background:var(--erro-bg);color:var(--erro);font-weight:700;box-shadow:inset 0 0 0 1px var(--erro-bd)}
.comp td.alerta{background:var(--alerta-bg);color:var(--alerta);font-weight:700;box-shadow:inset 0 0 0 1px var(--alerta-bd)}
.comp .esp{color:var(--ok);font-weight:600;font-size:11.5px}
.comp .sub{color:var(--fraco);font-size:11px;white-space:normal}
.comp-tit{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px}
.mais{padding:10px;text-align:center;border-top:1px solid var(--borda2)}
.aviso{padding:8px 12px;background:var(--alerta-bg);border:1px solid var(--alerta-bd);border-radius:4px;color:#6B4300;font-size:12px;margin-bottom:12px}
.vazio-res{padding:40px;text-align:center;color:var(--suave)}
.oculto{display:none!important}
@media (max-width:1000px){.cards{grid-template-columns:1fr 1fr}.duas{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.ref-corpo{grid-template-columns:1fr}.abas-pl{border-left:0}.mapa .grade{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.cards{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.top .emp{display:none}}

/* ================================================================== visual 2026 (shell com menu lateral) */
:root{--bg:#F4F6FA;--borda:#E1E6EE;--borda2:#EDF0F5;--navy:#0E2841;--navy2:#0A1E31;--azul:#2563A8;--palido:#EAF1FA;--texto:#16202E;--suave:#5A6476;--fraco:#8B95A7;--side:232px}
html,body{font:13.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:0 0 var(--side);background:linear-gradient(180deg,#0E2841 0%,#0A1E31 100%);color:#C9D3E1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px;z-index:30}
.brand{display:flex;flex-direction:column;gap:8px;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{height:26px;width:auto;align-self:flex-start}
.brand span{font-size:12px;font-weight:600;letter-spacing:.3px;color:#8FA3BD;text-transform:uppercase}
.side .emp{padding:14px 8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:#9FB0C6;line-height:1.35}
.side .emp b{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .emp .emp-comp{color:#fff;font-weight:600;margin-top:4px}
.side .emp-vz{color:#6F8299;font-style:italic}
.side .situacao{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:0 8px 14px;margin:0;font-size:11.5px;color:#9FB0C6;border-bottom:1px solid rgba(255,255,255,.08)}
.side .situacao:empty{display:none}
.side .situacao .sit-p{width:100%;height:5px;background:rgba(255,255,255,.12);border-radius:3px}
.side .situacao .sit-p i{background:#4ADE80;border-radius:3px}
.side .situacao select{background:#13304E;color:#E5ECF5;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 6px;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;padding-top:10px;flex:1;overflow:auto}
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#5F7591;padding:12px 10px 4px}
.nav button,.side-pe button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#C9D3E1;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav button svg,.side-pe button svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav button:hover:not(:disabled),.side-pe button:hover:not(:disabled){background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 #60A5FA}
.nav button:disabled,.side-pe button:disabled{opacity:.35;cursor:default}
.nav .badge{margin-left:auto;background:#DC2626;color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;line-height:16px}
.nav .badge:empty{display:none}
.side-pe{border-top:1px solid rgba(255,255,255,.08);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
header.pg{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--borda);padding:16px 28px 14px}
header.pg h1{margin:0;font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
header.pg p{margin:2px 0 0;color:var(--suave);font-size:12.5px}
main{max-width:1500px;width:100%;margin:0 auto;padding:20px 28px 60px}
.painel{border-radius:8px;border-color:var(--borda);box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0;overflow-x:auto}
.painel .ph{padding:11px 14px;border-bottom-color:var(--borda2);font-size:13px}
.tit{color:var(--navy);font-size:11.5px;letter-spacing:.7px;margin:14px 0 10px}
.btn{border-radius:6px;padding:6px 12px;border-color:var(--borda);transition:border-color .12s,background .12s}
.btn.pri{background:var(--navy);border-color:var(--navy)}
.btn.pri:hover{background:#163A5E}
.btn.grande{border-radius:8px;padding:12px 40px;box-shadow:0 2px 6px rgba(14,40,65,.18)}
.duas>*,.tres>*,.pn-g2>*,.rel-g>*,.cards>*,.kpis>*{min-width:0}
.kpis{border-radius:8px;overflow:hidden}
.kpi{padding:14px 18px}
.kpi .v{font-size:24px;letter-spacing:-.4px}
.kpi.erro,.kpi.alerta,.kpi.ok,.kpi.neutro,.kpi.corr{border-top-width:3px}
th{background:#F8FAFC;color:#64748B;font-size:10.5px;letter-spacing:.5px;border-bottom-color:var(--borda)}
td{border-bottom-color:var(--borda2)}
.notas tr.n:hover td,.mov tr.l:hover td,.devs tr:hover td{background:#F5F8FC}
.seg{border-radius:7px} .seg button.on{background:var(--navy)}
.filtros select,.filtros input,.params input,.cfg-ref input[type=text],.cfg-ref select,.aj input[type=text],.aj select{border-radius:6px;border-color:var(--borda)}
.filtros input:focus,.params input:focus,.cfg-ref input:focus{outline:2px solid #BFD6F2;border-color:var(--azul)}
.card .cab{padding:12px 14px} .drop{border-radius:8px;border-color:#C9D2DF;background:#FBFCFE}
.drop:hover,.drop.over{background:var(--palido);border-color:var(--azul)}
.tag{border-radius:5px;padding:1px 7px}
.xl-tabs button{border-radius:6px 6px 0 0}
.aviso{border-radius:7px}
.ap-lista{border-radius:7px}
.al-col.info{background:var(--palido);color:var(--navy);border-color:#C9D8EE}

/* célula clicável da planilha + menu + detalhamento */
table.xl td.x-ck{cursor:pointer} table.xl td.x-ck:hover{outline:2px solid #2563A8;outline-offset:-2px}
table.xl td.x-dt{background-image:linear-gradient(135deg,transparent 0 calc(100% - 7px),#2563A8 calc(100% - 7px))}

.cp-n{padding:0 12px 10px;color:var(--suave);font-size:11.5px}
.det-fundo{position:fixed;inset:0;z-index:70;background:rgba(10,30,49,.38);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px}
.det-box{background:#fff;border-radius:10px;width:min(1100px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,30,49,.3)}
.det-h{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--borda)}.det-h b{font-size:15px;color:var(--navy)}.det-h p{margin:3px 0 0;color:var(--suave);font-size:12.5px}
.det-c{overflow:auto;padding:0 0 4px}.det-pe{padding:8px 18px;border-top:1px solid var(--borda);color:var(--suave);font-size:12px}

.det-t tfoot td{font-weight:700;background:#F8FAFC;border-top:1px solid var(--borda)}.det-t tr.det-fora td{color:var(--fraco)} .det-t tr.det-fora td b{color:var(--fraco)}
.det-n{max-width:280px;font-size:11.5px;color:var(--suave)} .det-n summary{cursor:pointer} .det-tx{padding:12px 18px} .det-tx p{margin:4px 0}

/* notas lançadas à mão */
.painel.man{margin-top:14px}.painel.man .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

@media (max-width:900px){.man-f{grid-template-columns:1fr 1fr}.man-f .mf-nome,.man-f .mf-descricao{grid-column:1/-1}}

  .app{flex-direction:column}

}

<div class="app">

  </nav>
  <div class="side-pe">
    <button onclick="abrirHistorico()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Fechamentos</span></button>
    <button id="btnExport" onclick="location.href='/api/exportar'" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>Exportar Excel</span></button>

<input type="file" id="arq" multiple class="oculto">

<script>
const CARDS = [
  {id:'entrada',  t:'XML de Entrada',            s:'NF-e de compras recebidas',            ext:'.xml ou .zip', acc:'.xml,.zip'},
  {id:'saida',    t:'XML de Saída',              s:'NF-e e NFC-e emitidas',                ext:'.xml ou .zip', acc:'.xml,.zip'},
  {id:'frete',    t:'XML de Frete de Entrada',   s:'CT-e, se tiver',                       ext:'.xml ou .zip', acc:'.xml,.zip'},
  {id:'prestado', t:'XML de Serviços Prestados', s:'NFS-e emitidas pela empresa',          ext:'.xml ou .zip', acc:'.xml,.zip'},
  {id:'tomado',   t:'XML de Serviços Tomados',   s:'NFS-e recebidas de prestadores',       ext:'.xml ou .zip', acc:'.xml,.zip'},
  {id:'diversos', t:'Documentos Diversos',       s:'PDF geral de notas (DANFE, DACTE, NFS-e)', ext:'.pdf ou .zip', acc:'.pdf,.zip,.xml'},
  {id:'planilha', t:'Planilha do sistema',       s:'Opcional. Com ela, cada nota é comparada ao lançamento do sistema; sem ela, o fechamento sai só pelas notas', ext:'.xlsx, .xls ou .csv', acc:'.xlsx,.xls,.xlsm,.csv,.txt,.zip'},
  {id:'planilha_locacoes', t:'Relatório de locações', s:'Relatório do sistema do cliente: só o número da nota, o cliente e o valor da locação', ext:'.xlsx, .xls ou .csv', acc:'.xlsx,.xls,.xlsm,.csv,.txt,.zip'},
  {id:'serv_saida', t:'Relatório de saída de serviços', s:'Serviços prestados, do sistema do cliente (PDF ou Excel): confere as NFS-e e alimenta PIS/COFINS e a SCP', ext:'.pdf, .xlsx, .xls ou .csv', acc:'.pdf,.xlsx,.xls,.xlsm,.csv,.txt,.zip'},
  {id:'serv_entrada', t:'Relatório de entrada de serviços', s:'Serviços tomados, do sistema do cliente (PDF ou Excel): crédito de PIS/COFINS e retenções a recolher', ext:'.pdf, .xlsx, .xls ou .csv', acc:'.pdf,.xlsx,.xls,.xlsm,.csv,.txt,.zip'},
];
const MOVS = {entrada:'Entradas', saida:'Saídas', frete:'Frete de entrada', prestado:'Serviços prestados', tomado:'Serviços tomados', diversos:'Documentos diversos', indef:'Sem movimento'};
const SEVR = {erro:'Erro', alerta:'Conferir', ok:'Correta', cancelada:'Cancelada', info:'Info', corrigida:'Resolvida'};
const IMPORTANTES = ['numero','chave','cnpj','cfop','cst_icms','valor_contabil','base_icms','valor_icms','cst_pis','valor_pis'];
const IMPORTANTES_SV = ['numero','cnpj','valor_contabil','valor_iss','aliq_iss','iss_retido','irrf'];
let EST = null, PL = null, RES = null, cardAlvo = null, COR = {};
const SEV_AP = a => a.sev === 'erro' || a.sev === 'alerta';
const resol = k => { const v = COR[k]; if (!v) return null; return typeof v === 'string' ? {status:'corrigido', obs:'', em:v} : v; };
const pend = n => n.aponts.filter(a => SEV_AP(a) && !resol(a.k));
function st(n) {  // situação considerando o que já foi corrigido
  if (n.status !== 'erro' && n.status !== 'alerta') return n.status;
  const p = pend(n);
  return p.some(a => a.sev === 'erro') ? 'erro' : p.length ? 'alerta' : 'corrigida';
}
async function marcar(chaves, corrigido, status, obs) {
  COR = await api('/api/corrigido', {method:'POST', body: JSON.stringify({chaves, status: corrigido ? (status || 'corrigido') : null, obs: obs || ''})});
  desenharResultado(true); desenharSituacao();
}
const JUST = new Set();
function abrirJust(k) { JUST.has(k) ? JUST.delete(k) : JUST.add(k); desenharNotas(); setTimeout(() => { const t = document.getElementById('jt-' + btoa(unescape(encodeURIComponent(k))).replace(/=/g, '')); if (t) t.focus(); }, 30); }
function idk(k) { return btoa(unescape(encodeURIComponent(k))).replace(/=/g, ''); }
async function salvarJust(k) {
  const t = document.getElementById('jt-' + idk(k)); const v = (t?.value || '').trim();
  if (!v) { t.style.borderColor = 'var(--erro)'; t.placeholder = 'Escreva a justificativa'; return; }
  JUST.delete(k); await marcar([k], true, 'justificado', v);
}
async function salvarObs(nk) {
  const t = document.getElementById('obs-' + idk(nk)); const v = (t?.value || '').trim();
  COR = await api('/api/corrigido', {method:'POST', body: JSON.stringify({chaves: ['obs:' + nk], status: v ? 'obs' : null, obs: v})});
  const b = document.getElementById('obsb-' + idk(nk)); if (b) { b.textContent = '✓ Salva'; setTimeout(() => { b.textContent = 'Salvar observação'; }, 1500); }
}
let F = {mov:'', sit:'problema', cod:'', q:'', nat:'', cat:'', lim:150};
const aberto = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (v === null || v === undefined || v === '') ? '' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const rs = v => (v === null || v === undefined) ? '' : 'R$ ' + brl(v);
const kb = b => b > 1048576 ? (b/1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB';
const dt = d => d && /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(8,10) + '/' + d.slice(5,7) + '/' + d.slice(0,4) : (d || '');
const cnpjFmt = c => { c = String(c||''); return c.length === 14 ? c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : c.length === 11 ? c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4') : c; };

let ADM = null; try { ADM = sessionStorage.getItem('adm_token'); } catch (e) {}
let PERFIL = {perfil: 'completo'};
const COLAB = () => PERFIL.perfil === 'colaborador';
async function api(url, opt) {
  opt = opt || {};
  if (ADM) opt.headers = Object.assign({}, opt.headers || {}, {'X-ADM': ADM});
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = '/login'; throw new Error('Sessão expirada.'); }
  const j = await r.json().catch(() => ({erro: 'resposta inválida'}));
  if (!r.ok) throw new Error(j.erro || r.statusText);
  return j;
}

// ------------------------------------------------------------------ cards
function desenharCards() {
  const el = $('#cards');
  el.innerHTML = CARDS.map(c => {
    const st = EST?.cards?.[c.id] || {qtd:0, bytes:0, arquivos:[]};
    const qt = st.qtd ? `${st.qtd} arquivo${st.qtd > 1 ? 's' : ''}` : 'vazio';
    const corpoDrop = st.qtd
      ? `<div class="drop recebido" data-card="${c.id}"><div><b>✓ ${st.qtd} arquivo${st.qtd > 1 ? 's' : ''} recebido${st.qtd > 1 ? 's' : ''}</b></div><div class="ext">arraste ou clique para adicionar mais</div></div>`
      : `<div class="drop" data-card="${c.id}"><div><b>Arraste aqui</b> ou clique para escolher</div><div class="ext">${c.ext}</div></div>`;
    const ck = st.qtd ? '<span class="check" title="arquivo recebido">✓</span>' : '<span class="vazio-ck"></span>';
    const rod = `<div class="rod"><span>${st.qtd ? kb(st.bytes) : ''}</span><span class="esp">
        ${st.qtd ? `<button class="lnk" onclick="toggleLista('${c.id}')">ver arquivos</button><button class="lnk perigo" onclick="limpar('${c.id}')">limpar</button>` : ''}</span></div>`;
    const lista = `<div class="lista" id="lista-${c.id}">${st.arquivos.slice(0, 500).map(a => `<div><span title="${esc(a.nome)}">${esc(a.nome)}</span><span>${kb(a.tamanho)}</span><button title="remover" onclick="remover('${c.id}','${esc(a.nome).replace(/'/g, "\\'")}')">✕</button></div>`).join('')}${st.arquivos.length > 500 ? `<div><span>+ ${st.arquivos.length - 500} arquivos</span></div>` : ''}</div>`;
    if (c.id.startsWith('planilha')) {
      return `<div class="painel card ref ${st.qtd ? 'ok' : ''}"><div class="cab">${ck}<span class="t">${c.t}</span><span class="s">${c.s}</span><span class="qtd ${st.qtd ? 'tem' : ''}">${qt}</span></div>
        <div class="ref-corpo"><div style="display:flex;flex-direction:column">${corpoDrop}${rod}</div><div class="abas-pl" id="abasPl-${c.id}">${desenharPlanilha(c.id)}</div></div>${lista}</div>`;
    }
    return `<div class="painel card ${st.qtd ? 'ok' : ''}"><div class="cab">${ck}<div><div class="t">${c.t}</div><div class="s">${c.s}</div></div><span class="qtd ${st.qtd ? 'tem' : ''}">${qt}</span></div>${corpoDrop}${rod}${lista}</div>`;
  }).join('');
  el.querySelectorAll('.drop').forEach(d => {
    d.onclick = () => { cardAlvo = d.dataset.card; const i = $('#arq'); i.accept = CARDS.find(c => c.id === cardAlvo).acc; i.value = ''; i.click(); };
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = async e => { e.preventDefault(); d.classList.remove('over'); enviar(d.dataset.card, await arquivosDoDrop(e.dataTransfer)); };
  });
}

function desenharPlanilha(card) {
  const minhas = PL ? PL.abas.map((a, k) => [a, k]).filter(([a]) => (a.card || 'planilha') === card) : [];
  if (!minhas.length && card === 'planilha_locacoes') return `<div class="vazio">Envie o relatório de locações do sistema do cliente. Leio só o número da nota, o cliente e o valor da locação; se o relatório trouxer outras vendas junto (ex.: NFS-e), só as linhas de locação entram. Se o layout for outro, ajuste as colunas aqui e eu lembro nos próximos meses.</div>`;
  if (!minhas.length && card.startsWith('serv_')) return `<div class="vazio">Envie o relatório de ${card === 'serv_saida' ? 'saída (serviços prestados)' : 'entrada (serviços tomados)'} em PDF ou Excel. Reconheço número, data, ${card === 'serv_saida' ? 'tomador' : 'prestador'}, CNPJ/CPF, valor, base e valor do ISS, ISS retido, IRRF, CSLL, PIS, COFINS, INSS, código do serviço e líquido. PDF precisa ter texto (não escaneado).</div>`;
  if (!minhas.length) return card === 'planilha_servicos'
    ? `<div class="vazio">Envie o relatório de serviços do sistema (prestados e tomados). Reconheço número da NFS-e, CNPJ, valor, ISS, alíquota, ISS retido, IRRF, CSLL, PIS, COFINS, INSS, código do serviço e base do ISS. Se o relatório tiver uma coluna Prestado/Tomado (ou abas separadas), uso ela.</div>`
    : `<div class="vazio">Envie a planilha exportada do sistema. Eu reconheço as colunas sozinho (número, chave, CNPJ, CFOP, CST, valores) e você ajusta aqui se precisar.</div>`;
  const rot = Object.fromEntries(PL.campos.map(c => [c.campo, c.rotulo]));
  return minhas.map(([a, k]) => {
    if (a.erro) return `<div class="aba-pl"><div class="l1"><b>${esc(a.arquivo)}</b><span class="chip ruim">não consegui ler: ${esc(a.erro)}</span></div></div>`;
    const ordem = PL.campos.map(c => c.campo);

async function arquivosDoDrop(dtf) {
  const itens = [...(dtf.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!itens.length) return [...dtf.files];
  const out = [];
  const ler = ent => new Promise(res => {
    if (ent.isFile) ent.file(f => { out.push(f); res(); }, () => res());
    else if (ent.isDirectory) {
      const r = ent.createReader(); const todos = [];
      const lote = () => r.readEntries(async ents => { if (!ents.length) { for (const e of todos) await ler(e); res(); } else { todos.push(...ents); lote(); } }, () => res());
      lote();
    } else res();
  });
  for (const e of itens) await ler(e);
  return out;
}

async function enviar(card, arquivos) {
  if (!arquivos.length) return;

  msg(`Enviando ${arquivos.length} arquivo(s)…`);
  const fila = [...arquivos];
  const trabalhador = async () => {
    while (fila.length) {
      const f = fila.shift();
      try { const r = await api(`/api/upload?card=${card}&nome=${encodeURIComponent(f.name)}`, {method:'POST', body: f}); salvos += r.salvos; EST = r.estado; }
      catch (e) { console.error(e); }
      feitos++; barra.style.width = (100 * feitos / arquivos.length) + '%';
      if (feitos % 25 === 0) msg(`Enviando ${feitos}/${arquivos.length}…`);
    }
  };
  await Promise.all([1,2,3,4].map(trabalhador));
  prog.style.display = 'none'; barra.style.width = 0;

    <div class="sec-p">Inutilizadas (${inut.length})</div>${inut.length ? inut.map(u => `<div class="it" style="cursor:default"><span><b>Série ${esc(u.serie)}: ${u.ini === u.fim ? u.ini : u.ini + ' a ' + u.fim}</b> · ${esc(u.just || '')}</span><span>${u.problemas.length ? '<span class="tag erro">' + u.problemas.length + ' problema(s)</span>' : '<span class="tag ok">OK</span>'}</span>${u.problemas.length ? '<small>' + esc(u.problemas.join('; ')) + '</small>' : ''}</div>`).join('') : '<div class="vz">Nenhum XML de inutilização no lote.</div>'}
    <div class="sec-p">Números pulados na série (${pulos.length})</div>${pulos.length ? pulos.map(p => { const n = RES.notas.find(x => x.natureza === 'numeracao' && x.serie === p.serie && x.numero === (p.ini === p.fim ? String(p.ini) : p.ini + ' a ' + p.fim)); return item(n ? n.id : 0, `Série ${esc(p.serie)}: <b>${p.ini === p.fim ? p.ini : p.ini + ' a ' + p.fim}</b>`, n ? tagSt(st(n)) : '', 'sem XML, cancelamento ou inutilização'); }).join('') : '<div class="vz">Numeração própria sem buracos.</div>'}
    </div></div>`;
  const lista = devs.length ? `<div class="painel" style="margin-bottom:14px"><div class="ph">Devoluções <small>cada devolução contra a nota de origem: itens, quantidade, preço, ICMS/IPI/ST e CFOP</small></div>
    <div style="overflow:auto"><table class="devs"><thead><tr><th>Situação</th><th>Devolução</th><th>Tipo</th><th>Participante</th><th>Nota de origem</th><th class="num">Valor origem</th><th class="num">Devolvido</th><th class="num">%</th><th class="num">No sistema</th><th>Apontamentos</th></tr></thead><tbody>
    ${devs.map(d => { const n = notaPor(d.id); const s = st(n); const aps = pend(n);
      return `<tr onclick="abrirNota(${d.id})"><td>${tagSt(s)}</td><td><b>${esc(d.numero)}</b><br><span style="color:var(--fraco)">${dt(d.emissao)}</span></td><td>${esc(d.rotulo)}</td><td class="part"><span class="nm">${esc(d.part_nome)}</span></td>
        <td>${d.originais.length ? d.originais.map(o => `<b>${esc(o.numero)}</b> <span style="color:var(--fraco)">${dt(o.emissao)}</span>`).join('<br>') : '<span style="color:var(--fraco)">não referenciada / fora do lote</span>'}</td>
        <td class="num">${d.originais.length ? brl(d.originais.reduce((t, o) => t + o.valor, 0)) : ''}</td><td class="num">${brl(d.valor)}</td><td class="num">${d.pct != null ? String(d.pct).replace('.', ',') + '%' : ''}</td>
        <td class="num">${d.valor_sis == null ? '<span class="zero">não lançada</span>' : brl(d.valor_sis)}</td>
        <td><div class="aps">${aps.slice(0, 3).map(a => `<span class="tag ${a.sev}">${esc(a.titulo)}</span>`).join('') || '<span style="color:var(--fraco)">bate com a origem</span>'}</div></td></tr>`; }).join('')}
    </tbody></table></div></div>` : '';
  return `<div class="tres">${bal}${cn}</div>${lista}`;
}

function verCanceladas() { mostrar('res'); filtrar({nat: 'cancelada', sit: 'todas', cod: '', cat: '', mov: '', q: ''}); }
async function marcarCancelada(chave, sim, num) {
  if (!confirm(sim ? `Marcar a nota ${num} como cancelada? Ela sai do faturamento, dos créditos, dos relatórios e da Estratégia.` : `A nota ${num} vale? Ela volta para todas as contas.`)) return;
  await api('/api/canceladas', {method: 'POST', body: JSON.stringify({chave, cancelada: sim})});
  await calcular();
}
function abrirNota(id) {
  if ($('#secRes').classList.contains('oculto')) mostrar('res');
  const n = RES.notas.find(x => x.id === id); if (!n) return;
  Object.assign(F, {mov:'', sit:'todas', cod:'', nat:'', cat:'', q: n.numero || '', lim:150}); aberto.add(id);
  desenharResultado();
  const tr = [...document.querySelectorAll('tr.n')].find(t => t.getAttribute('onclick') === `abrir(${id})`);
  if (tr) window.scrollTo(0, tr.getBoundingClientRect().top + scrollY - 110);
}

function filtrar(o) {
  if ('mov' in o && o.mov === F.mov && Object.keys(o).length === 1) o.mov = '';
  if ('cod' in o && o.cod && o.cod === F.cod) { o.cod = ''; o.sit = 'problema'; }
  Object.assign(F, o, {lim:150});
  desenharResultado();
  document.getElementById('filtros').scrollIntoView({behavior:'smooth', block:'start'});
}

function passa(n, ignorar) {
  if (ignorar !== 'mov' && F.mov && n.mov !== F.mov) return false;
  if (ignorar !== 'sit') {
    const s = st(n);
    if (F.sit === 'problema' && !(s === 'erro' || s === 'alerta')) return false;
    if (F.sit === 'erro' && s !== 'erro') return false;
    if (F.sit === 'alerta' && s !== 'alerta') return false;
    if (F.sit === 'corrigida' && s !== 'corrigida') return false;
    if (F.sit === 'ok' && !(s === 'ok' || s === 'cancelada')) return false;
  }
  if (ignorar !== 'cat' && F.cat && !n.aponts.some(a => a.categoria === F.cat && (F.sit === 'corrigida' || F.sit === 'todas' || !resol(a.k)))) return false;
  if (ignorar !== 'nat' && F.nat) {
    const g = {dev: ['dev_venda','dev_compra','dev_compra_forn'], cancelada: ['cancelada'], inut: ['inutilizada','numeracao'], comp: ['complementar','ajuste'], normal: ['normal']}[F.nat] || [];
    const cancSis = F.nat === 'cancelada' && n.aponts.some(a => a.cod === 'CANCELADA_SO_NO_SISTEMA');
    if (!g.includes(n.natureza) && !cancSis) return false;
  }
  if (F.cod && !n.aponts.some(a => a.cod === F.cod && (F.sit === 'corrigida' || F.sit === 'todas' || !resol(a.k)))) return false;
  if (F.q) {
    const q = F.q.toLowerCase().replace(/[.\-\/]/g, '');
    const alvo = [n.numero, n.part_nome, n.part_cnpj, n.chave, ...n.aponts.map(a => a.titulo)].join(' ').toLowerCase().replace(/[.\-\/]/g, '');
    if (!alvo.includes(q)) return false;
  }
  return true;
}

function desenharNotas() {
  const buscando = document.activeElement && document.activeElement.matches && document.activeElement.matches('#filtros input');
  const ns = RES.notas.filter(n => passa(n));
  const cont = (campo, val) => RES.notas.filter(n => passa(n, campo) && (campo === 'mov' ? (!val || n.mov === val) : true)).length;
  const sitN = s => RES.notas.filter(n => passa(n, 'sit') && (s === 'todas' || (s === 'problema' ? ['erro','alerta'].includes(st(n)) : s === 'ok' ? ['ok','cancelada'].includes(st(n)) : st(n) === s))).length;
  const movs = Object.keys(RES.movimentos);
  $('#filtros').innerHTML = `
    <div class="seg">${[['problema','Com problema'],['erro','Erros'],['alerta','Conferir'],['corrigida','Resolvidas'],['ok','Corretas'],['todas','Todas']].map(([k, t]) => `<button class="${F.sit === k ? 'on' : ''}" onclick="filtrar({sit:'${k}'})">${t}<span class="c">${sitN(k)}</span></button>`).join('')}</div>
    <select onchange="filtrar({mov:this.value})"><option value="">Todos os movimentos (${cont('mov', '')})</option>${movs.map(k => `<option value="${k}" ${F.mov === k ? 'selected' : ''}>${MOVS[k]} (${cont('mov', k)})</option>`).join('')}</select>
    <select onchange="filtrar({cod:this.value})"><option value="">Todos os apontamentos</option>${RES.ranking.map(x => `<option value="${x.cod}" ${F.cod === x.cod ? 'selected' : ''}>${esc(x.titulo)} (${x.notas})</option>`).join('')}</select>
    <select onchange="filtrar({cat:this.value,cod:''})"><option value="">Todas as categorias</option>${(RES.categorias || []).filter(([c]) => RES.notas.some(n => n.aponts.some(a => a.categoria === c && SEV_AP(a)))).map(([c, r]) => `<option value="${c}" ${F.cat === c ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
    <select onchange="filtrar({nat:this.value})">${[['','Todos os tipos de documento'],['normal','Normais'],['dev','Devoluções'],['cancelada','Canceladas'],['inut','Inutilizadas e numeração'],['comp','Complementares/ajuste']].map(([k, t]) => `<option value="${k}" ${F.nat === k ? 'selected' : ''}>${t} (${RES.notas.filter(n => passa(n, 'nat') && (!k || ({dev:['dev_venda','dev_compra','dev_compra_forn'],cancelada:['cancelada'],inut:['inutilizada','numeracao'],comp:['complementar','ajuste'],normal:['normal']}[k]).includes(n.natureza))).length})</option>`).join('')}</select>
    <button class="btn peq ${F.nat === 'cancelada' ? 'pri' : ''}" onclick="filtrar({nat: F.nat === 'cancelada' ? '' : 'cancelada', sit: 'todas', cod: '', cat: ''})">Só canceladas (${RES.notas.filter(n => n.natureza === 'cancelada' || n.aponts.some(a => a.cod === 'CANCELADA_SO_NO_SISTEMA')).length})</button>
    <input placeholder="Buscar nº, fornecedor, CNPJ, chave" value="${esc(F.q)}" oninput="F.q=this.value;F.lim=150;clearTimeout(window._t);window._t=setTimeout(desenharNotas,200)">
    <span class="lim">${ns.length} nota${ns.length !== 1 ? 's' : ''}</span>`;
  const corpo = ns.slice(0, F.lim).map(n => linhaNota(n) + (aberto.has(n.id) ? detalhe(n) : '')).join('');
  $('#loteBar').innerHTML = barraLote();
  $('#tbNotas').innerHTML = corpo || `<tr><td colspan="10" class="vazio-res">Nenhuma nota neste filtro.</td></tr>`;
  $('#mais').innerHTML = ns.length > F.lim ? `<button class="btn" onclick="F.lim+=300;desenharNotas()">Mostrar mais (${ns.length - F.lim} restantes)</button>` : '';
  if (buscando) { const i = $('#filtros input'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

function linhaNota(n) {
  const aps = pend(n);
  const s = st(n);
  const vis = aps.slice(0, 3).map(a => `<span class="tag ${a.sev}" title="${esc(a.detalhe)}">${esc(a.titulo)}</span>`).join('') + (aps.length > 3 ? `<span class="tag info">+${aps.length - 3}</span>` : '');
  const dif = n.valor_xml != null && n.valor_sis != null && Math.abs(n.valor_xml - n.valor_sis) > 0.05;
  return `<tr class="n ${aberto.has(n.id) ? 'aberta' : ''}" onclick="abrir(${n.id})">
    <td><span class="dot ${s}"></span></td>
    <td><span class="tag ${s}">${SEVR[s]}</span></td>
    <td>${esc(MOVS[n.mov] || n.mov)}</td>
    <td style="white-space:nowrap"><b>${esc(n.tipo)} ${esc(n.numero || 's/n')}</b>${n.serie ? `<span style="color:var(--fraco)"> / ${esc(n.serie)}</span>` : ''}${n.natureza && n.natureza !== 'normal' ? `<br><span class="nat ${n.natureza}" style="margin-left:0">${esc(n.natureza_rot)}</span>` : ''}</td>
    <td style="white-space:nowrap">${dt(n.emissao)}</td>
    <td class="part"><span class="nm" title="${esc(n.part_nome)}">${esc(n.part_nome || '')}</span><span class="cn">${esc(cnpjFmt(n.part_cnpj))}${n.part_uf ? ' · ' + esc(n.part_uf) : ''}</span></td>
    <td class="num">${n.valor_xml != null ? brl(n.valor_xml) : '<span class="zero">sem XML</span>'}</td>
    <td class="num" style="${dif ? 'color:var(--erro);font-weight:700' : ''}">${n.valor_sis != null ? brl(n.valor_sis) : '<span class="zero">não lançada</span>'}</td>
    <td><div class="aps">${vis || (s === 'cancelada' ? '<span class="tag cancelada">Cancelada, fora do sistema</span>' : s === 'corrigida' ? '<span class="tag corrigida">✓ tudo corrigido</span>' : '<span style="color:var(--fraco)">sem divergência</span>')}</div></td>
    <td class="seta">›</td></tr>`;
}

function abrir(id) { aberto.has(id) ? aberto.delete(id) : aberto.add(id); desenharNotas(); }

const COLS_NF = [['cfop','CFOP'],['cst','CST'],['vc','Valor'],['bc','Base ICMS'],['aliq','Alíq.'],['icms','ICMS'],['st','ICMS-ST'],['ipi','IPI'],['pis','PIS'],['cofins','COFINS'],['cst_pis','CST PIS']];
const COLS_SV = [['servico','Item LC'],['vc','Valor serviço'],['base_iss','Base ISS'],['iss','ISS'],['aliq_iss','Alíq. ISS'],['iss_retido','ISS retido'],['irrf','IRRF'],['csll','CSLL'],['inss','INSS'],['pis_ret','PIS ret.'],['cofins_ret','COFINS ret.'],['vliq','Líquido']];
const MOEDA = new Set(['vc','bc','icms','st','ipi','pis','cofins','iss','irrf','csll','inss','pis_ret','cofins_ret','base_iss','vliq']);

function detalhe(n) {
  const aps = n.aponts.filter(a => a.sev !== 'info');
  const infos = n.aponts.filter(a => a.sev === 'info');
  const meta = [
    n.chave ? `Chave <code>${esc(n.chave)}</code>` : '',
    n.arquivo ? `Arquivo <b>${esc(n.arquivo)}</b>` : '',
    n.ref_planilha ? `Na planilha <b>${esc(n.ref_planilha)}</b>` : '',
    n.data_lanc ? `Lançada em <b>${dt(n.data_lanc)}</b>` : '',
    n.pdf ? `PDF <b>${esc(n.pdf)}</b>` : '',
    n.como && n.como !== 'chave' ? `Vínculo por <b>${{numero_cnpj:'número + CNPJ', numero_valor:'número + valor', numero:'só número'}[n.como] || n.como}</b>` : '',
    (n.chave || n.arquivo) && n.tipo !== 'Lançamento' ? (n.natureza !== 'cancelada'
      ? `<button class="btn peq" onclick='event.stopPropagation();marcarCancelada(${esc(JSON.stringify(n.chave || n.arquivo))}, true, ${esc(JSON.stringify(n.numero))})'>Marcar como cancelada</button>`
      : (['duplicada', 'manual'].includes(n.cancel_fonte) ? `<button class="btn peq" onclick='event.stopPropagation();marcarCancelada(${esc(JSON.stringify(n.chave || n.arquivo))}, false, ${esc(JSON.stringify(n.numero))})'>Não está cancelada</button>` : '')) : '',
  ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
  const abertos = aps.filter(a => SEV_AP(a) && !resol(a.k)).map(a => a.k);
  const feitos = aps.filter(a => SEV_AP(a) && resol(a.k)).map(a => a.k);
  const acoes = (abertos.length > 1 || feitos.length) ? `<div class="det-acoes">${abertos.length > 1 ? `<button class="btn-ok" onclick='event.stopPropagation();marcar(${esc(JSON.stringify(abertos))}, true)'>✓ Marcar todos como corrigidos</button>` : ''}
      ${feitos.length ? `<span style="color:var(--ok);font-size:12px">${feitos.length} de ${feitos.length + abertos.length} resolvido(s)</span>` : ''}</div>` : '';
  const catRot = Object.fromEntries(RES.categorias || []);
  const linhaAp = a => {
    const r = resol(a.k), jid = idk(a.k), abrindo = JUST.has(a.k);
    const tag = r ? `<span class="tag corrigida">${r.status === 'justificado' ? 'Justificado' : 'Corrigido'}</span>` : `<span class="tag ${a.sev}">${SEVR[a.sev]}</span>`;
    const tb = (a.tambem || []).length ? `<div class="tb"><b>Também:</b> ${a.tambem.map(esc).join(' · ')}</div>` : '';
    const pq = a.fundamento ? `<div class="pq"><b>Por que é erro:</b> ${esc(a.fundamento)}</div>` : '';
    const bts = SEV_AP(a) ? `<div class="btns">
        <button class="btn-ok ${r && r.status === 'corrigido' ? 'on' : ''}" title="${r && r.status === 'corrigido' ? 'Desfazer' : 'Marcar como corrigido no sistema'}" onclick='event.stopPropagation();marcar([${esc(JSON.stringify(a.k))}], ${!(r && r.status === 'corrigido')})'>${r && r.status === 'corrigido' ? '✓ Corrigido' : 'Corrigido'}</button>
        <button class="btn-just ${r && r.status === 'justificado' ? 'on' : ''}" title="${r && r.status === 'justificado' ? 'Desfazer a justificativa' : 'Não é erro: escrever a justificativa'}" onclick='event.stopPropagation();${r && r.status === 'justificado' ? `marcar([${esc(JSON.stringify(a.k))}], false)` : `abrirJust(${esc(JSON.stringify(a.k))})`}'>${r && r.status === 'justificado' ? '✓ Justificado' : 'Justificar'}</button></div>` : '';
    const just = r && r.obs ? `<div class="just"><b>${r.status === 'justificado' ? 'Justificativa' : 'Observação'}:</b> ${esc(r.obs)} <span style="color:var(--fraco)">· ${esc(r.em || '')}</span></div>` : (r ? `<div class="just" style="background:none;border:0;padding:0;color:var(--fraco)">corrigido em ${esc(r.em || '')}</div>` : '');
    const form = abrindo && !r ? `<div class="jform" onclick="event.stopPropagation()"><textarea id="jt-${jid}" placeholder="Por que não é erro? Ex.: cliente optou por não tomar o crédito; nota de origem é de agosto..."></textarea>
        <button class="btn pri peq" onclick='event.stopPropagation();salvarJust(${esc(JSON.stringify(a.k))})'>Salvar</button><button class="btn peq" onclick='event.stopPropagation();abrirJust(${esc(JSON.stringify(a.k))})'>Cancelar</button></div>` : '';
    return `<div class="ap ${a.sev} ${r ? 'feito' : ''}"><span>${tag}</span><span><span class="cat">${esc(catRot[a.categoria] || '')}</span><div class="tt">${esc(a.titulo)}</div><div class="dd">${esc(a.detalhe)}</div>${tb}${pq}</span><span class="vx">${esc(a.xml)}</span><span class="vs">${esc(a.sis)}</span><span class="cr">${esc(a.correcao)}</span>${bts}${just}${form}</div>`;
  };
  const lista = aps.length ? `${acoes}<div class="ap-lista"><div class="ap cab"><span>Situação</span><span>O que está errado</span><span>Na nota (XML)</span><span>No sistema</span><span>Como corrigir</span><span></span></div>${aps.map(linhaAp).join('')}</div>` : '';
  const ck = (n.checklist || []).length ? `<div class="ck"><span class="t">Pontos conferidos</span>${n.checklist.map(c => {
      let s = c.st; if ((s === 'erro' || s === 'alerta') && c.ks.every(k => resol(k))) s = 'resolvido';
      const ic = {ok:'✓', erro:'✗', alerta:'!', nao:'–', resolvido:'✓'}[s];
      return `<span class="p ${s}" title="${esc(c.obs || {ok:'conferido, sem divergência', erro:'com erro', alerta:'para conferir', resolvido:'resolvido'}[s])}">${ic} ${esc(c.rot)}${s === 'nao' ? ' <span style="font-weight:400">(' + esc(c.obs) + ')</span>' : ''}</span>`; }).join('')}</div>` : '';
  const ob = resol('obs:' + n.k);
  const obs = n.k ? `<div class="obs-nota" onclick="event.stopPropagation()"><label>Observação da nota</label><textarea id="obs-${idk(n.k)}" placeholder="Anotação para a equipe ou para o cliente (opcional)">${esc(ob ? ob.obs : '')}</textarea><button class="btn peq" id="obsb-${idk(n.k)}" onclick="event.stopPropagation();salvarObs(${esc(JSON.stringify(n.k))})">Salvar observação</button></div>` : '';
  return `<tr class="det"><td colspan="10"><div class="in"><div class="meta">${meta}</div>${infos.map(i => `<div class="aviso" style="background:var(--palido);border-color:#C9D8EE;color:var(--navy)">${esc(i.titulo)}${i.detalhe ? ': ' + esc(i.detalhe) : ''}</div>`).join('')}${ck}${lista}${obs}${comparativo(n)}</div></td></tr>`;
}

function comparativo(n) {
  if (!n.pares || !n.pares.length) return '';
  const servico = n.pares.some(p => p.servico);
  const cols = servico ? COLS_SV : COLS_NF;
  // marca célula por (par, campo)
  const marca = {};
  for (const a of n.aponts) {
    if (a.sev !== 'erro' && a.sev !== 'alerta') continue;
    let campos = (a.campos && a.campos.length ? a.campos : [a.campo]).filter(Boolean);
    campos = campos.map(c => (servico && (c === 'pis' || c === 'cofins')) ? c + '_ret' : (c === 'pis_bc' ? 'pis' : c));
    if (a.cod === 'VALOR_TOTAL') campos = ['vc'];
    let pares = (a.pares && a.pares.length) ? a.pares : (a.par === null || a.par === undefined ? [] : [a.par]);
    if (!pares.length && a.cod === 'VALOR_TOTAL' && n.pares.length === 1) pares = [0];
    const sev = resol(a.k) ? '' : a.sev;
    if (!sev) continue;
    for (const i of pares) for (const c of campos) { const k = i + ':' + c; if (marca[k] !== 'erro') marca[k] = sev; }
  }
  const val = (c, v) => (v === undefined || v === null || v === '') ? '' : (MOEDA.has(c) ? brl(v) : (c === 'aliq_iss' && v ? String(v).replace('.', ',') + '%' : (c === 'aliq' && v ? String(v).replace(/\./g, ',') + '%' : esc(v))));
  const linhas = n.pares.map((p, i) => {
    const x = p.xml, s = p.sis;
    const lx = x ? `<tr class="x"><td class="lado">Nota</td>${cols.map(([c]) => {
      let v = val(c, x[c]);
      if (c === 'cfop' && !servico && p.esperado && p.esperado !== x.cfop) v += ` <span class="esp">→ ${esc(p.esperado)}</span>`;
      return `<td class="${MOEDA.has(c) ? 'num' : ''}">${v}</td>`; }).join('')}<td class="sub">${esc(p.desc_xml || '')}${p.prod && p.prod.length ? '<br>' + p.prod.map(esc).join('; ') : ''}${p.destino ? '<br><b style="color:var(--navy)">Destino provável: ' + esc(p.destino) + '</b>' : ''}</td></tr>`
      : `<tr class="x"><td class="lado">Nota</td><td colspan="${cols.length}" class="sub">sem itens equivalentes na nota</td><td></td></tr>`;

const kSim = s => s.numero + '|' + s.cnpj;

function difalLinha(d) {

async function desenharSituacao(forcar) {

// ------------------------------------------------------------------ pendências do cliente (mensagem pronta)
function pendenciasCliente() {
  const grupos = [];
  const add = (txt, itens) => { if (itens.length) grupos.push({txt, itens}); };
  const nums = f => [...new Set(RES.notas.filter(f).map(n => n.numero).filter(Boolean))];
  const com = (cod, re) => n => pend(n).some(a => a.cod === cod && (!re || re.test(a.detalhe)));
  add('XML dos CT-e (fretes) lançados', nums(com('SEM_XML', /CT-e/)));
  add('XML das notas de meses anteriores lançadas agora', nums(com('SEM_XML', /lançada neste mês/)));
  add('XML (ou cópia) destas notas lançadas', nums(n => pend(n).some(a => a.cod === 'SEM_XML' && !/CT-e|lançada neste mês|Energia/.test(a.detalhe))));
  add('fatura (PDF) de energia e telecomunicação', nums(com('SEM_XML', /Energia/)));
  add('XML do cancelamento (evento) destas notas canceladas no sistema', nums(com('CANCELADA_SO_NO_SISTEMA')));
  add('XML autorizado (com protocolo) destas notas', nums(com('XML_SEM_PROTOCOLO')));
  add('XML, cancelamento ou inutilização destes números', RES.notas.filter(com('NUMERO_PULADO')).map(n => 'série ' + n.serie + ': ' + n.numero));
  add('nota de origem destas devoluções', nums(com('DEV_SEM_REF')));
  const mp = RES.movimentos || {};
  if (((mp.prestado && mp.prestado.xml) || (mp.tomado && mp.tomado.xml)) && !(EST && EST.cards && EST.cards.planilha_servicos && EST.cards.planilha_servicos.qtd))
    grupos.push({txt: 'relatório de serviços prestados e tomados do sistema (Excel)', itens: []});
  return grupos;
}

  const e = RES.empresa || {}, comp = (RES.competencia || '').split('-').reverse().join('/');

function copiarPend(b) {

// ------------------------------------------------------------------ correção em lote (padrão)
function barraLote() {
  if (!F.cod) return '';
  const alvo = RES.notas.filter(n => passa(n)).flatMap(n => n.aponts.filter(a => a.cod === F.cod && SEV_AP(a) && !resol(a.k)));
  if (alvo.length < 2) return '';
  const tit = (RES.ranking.find(x => x.cod === F.cod) || {}).titulo || '';
  return `<div class="lote"><span><b>${alvo.length}</b> apontamentos "${esc(tit)}" pendentes neste filtro. Se é um padrão do sistema do cliente, resolva todos de uma vez:</span>
    <button class="btn-ok" onclick='marcar(${esc(JSON.stringify(alvo.map(a => a.k)))}, true)'>✓ Corrigir todos</button>
    <input id="loteJust" type="text" placeholder="Justificativa para todos (ex.: padrão do sistema, cliente orientado)">
    <button class="btn-just" onclick='(function(){const v=document.getElementById("loteJust").value.trim(); if(!v){document.getElementById("loteJust").focus();return;} marcar(${esc(JSON.stringify(alvo.map(a => a.k)))}, true, "justificado", v);})()'>Justificar todos</button></div>`;
}

    if (!APU) await carregarApu();
    await api('/api/apuracao', {method: 'POST', body: JSON.stringify({estado: APU, calc: calcApu()})}).catch(() => {});
  }
}
async function desenharRelatorios() {

  const receitas = [['consolidado', 'Consolidado'], ['produtos', 'Produtos'], ['servicos', 'Serviços'], ['locacoes', 'Locações']];
  const card = (tipo, tit, sub, ctrls) => `<div class="painel rel-c"><div class="ph">${tit}</div><div class="rel-s">${sub}</div><div class="rel-o">${ctrls || ''}</div>
    <div class="rel-b"><button class="btn peq" onclick="preverRel('${tipo}')">Ver na tela</button><button class="btn peq pri" onclick="baixarRel('${tipo}','pdf')">PDF</button><button class="btn peq pri" onclick="baixarRel('${tipo}','xlsx')">Excel</button></div></div>`;
  $('#secRel').innerHTML = `<div class="rel-g">

    ${card('movimento', 'Entradas e saídas', 'Todos os documentos do mês sem as canceladas, com valores, impostos e se estão no sistema.', `<label>Receita ${sel('movimento', 'receita', receitas)}</label><label>Movimento ${sel('movimento', 'direcao', [['ambos', 'Entradas e saídas'], ['entradas', 'Só entradas'], ['saidas', 'Só saídas']])}</label>`)}
    ${COLAB() ? '' : card('scp', 'Estratégia Matriz × SCP', 'Distribuição do faturamento, apuração de PIS/COFINS e IRPJ/CSLL de cada empresa, memória de cálculo, comparativo e riscos.')}
    ${COLAB() ? '' : card('estrategico', 'Visão estratégica', 'Evolução mês a mês, margem, saldo credor, créditos não aproveitados, Lucro Real, reforma, risco e indicadores do fechamento.')}
    ${card('participantes', 'Clientes e fornecedores', 'Ranking por valor, com produtos × serviços, regime do fornecedor, impostos e retenções.', `<label>Quem ${sel('participantes', 'quem', [['ambos', 'Clientes e fornecedores'], ['clientes', 'Só clientes'], ['fornecedores', 'Só fornecedores']])}</label><label>Receita ${sel('participantes', 'receita', receitas)}</label>`)}

async function baixarRel(tipo, fmt) {
  await garantirCalcApu();

}
async function preverRel(tipo) {
  await garantirCalcApu();

function previaHtml(r) {
  const fmt = (v, t) => v == null || v === '' ? '' : (t === 'brl' ? brl(v) : (t === 'pct' ? String(v.toFixed ? v.toFixed(2) : v).replace('.', ',') : esc(v)));
  return `<div class="painel"><div class="ph">${esc(r.titulo)}${r.subtitulo ? ` <small>${esc(r.subtitulo)}</small>` : ''}<span style="margin-left:auto;color:var(--fraco);font-size:12px;font-weight:400">${esc(r.empresa)} · competência ${esc(r.competencia)}</span></div>
    ${r.secoes.map(s => `<div class="rel-sec"><div class="tit" style="margin:12px 12px 6px">${esc(s.titulo)}</div><div style="overflow:auto;max-height:520px"><table class="pn-t rel-t"><thead><tr>${s.colunas.map(c => `<th class="${['brl', 'pct', 'int'].includes(c[1]) ? 'num' : ''}">${esc(c[0])}</th>`).join('')}</tr></thead><tbody>
      ${s.linhas.slice(0, 400).map(l => `<tr>${l.map((v, i) => `<td class="${['brl', 'pct', 'int'].includes(s.colunas[i][1]) ? 'num' : ''}">${fmt(v, s.colunas[i][1])}</td>`).join('')}</tr>`).join('')}
      ${s.totais ? `<tr class="tot">${s.totais.map((v, i) => `<td class="${['brl', 'pct', 'int'].includes(s.colunas[i][1]) ? 'num' : ''}">${fmt(v, s.colunas[i][1])}</td>`).join('')}</tr>` : ''}</tbody></table></div>
      ${s.linhas.length > 400 ? `<div class="apu-nota">Mostrando 400 de ${s.linhas.length} linhas; o PDF e o Excel trazem todas.</div>` : ''}${s.nota ? `<div class="apu-nota">${esc(s.nota)}</div>` : ''}</div>`).join('')}</div>`;
}

        <td><div class="bt-ev" title="Receita ${rs(x.receita)}"><i style="width:${Math.max(2, 100 * x.receita / maxR)}%"></i></div></td><td class="num">${brl(x.compras)}</td><td class="num">${brl(x.margem)}</td>
        <td class="num" title="positivo: a recolher; negativo: saldo credor">${brl(x.icms_saldo)}</td><td class="num">${brl(x.ipi_saldo)}</td><td class="num">${pc(x.carga)}</td><td class="num">${x.com_erro}</td></tr>`).join('')}</tbody></table></div>

  // 2. margem
  const m = e.margem;

    ['= Margem bruta estimada', `<span style="color:${m.margem < 0 ? 'var(--erro)' : 'var(--ok)'}">${brl(m.margem)}</span>`, 'tot'], ['Margem sobre a venda', pc(m.margem_pct)]]) + prem([m.premissa]));
  // 3. saldo credor
  const sd = e.saldo;
  const sal = pnl('Saldo credor e o que fazer com ele', '', tb([['ICMS', sd.icms.credor ? `<span style="color:var(--ok)">credor ${brl(sd.icms.valor)}</span>` : `a recolher ${brl(sd.icms.valor)}`],
      ['IPI', sd.ipi.credor ? `<span style="color:var(--ok)">credor ${brl(sd.ipi.valor)}</span>` : `a recolher ${brl(sd.ipi.valor)}`]].concat(sd.meses_para_consumir ? [['Meses para consumir o saldo de ICMS (pela média)', String(sd.meses_para_consumir).replace('.', ',')]] : [])) +

  // 5. lucro real
