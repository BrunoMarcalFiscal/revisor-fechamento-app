      ['= PIS/COFINS a recolher (estimado)', brl(lr.pc_saldo), 'tot'], ['PIS/COFINS destacado nas NF-e de venda', brl(lr.pc_destacado_xml), 'sub', 'para conferência'],
      ['IRPJ estimado', brl(lr.irpj), 'tot', 'base presumida ' + rs(lr.irpj_base) + ' · 15% + adicional de 10% acima de R$ 20.000'], ['CSLL estimada', brl(lr.csll), 'tot', 'base presumida ' + rs(lr.csll_base) + ' · 9%']]) + prem(lr.premissas));
  // 6. reforma
  const rf = e.reforma, deb = rf.receita_base * REF.cbs / 100, cr = rf.compras_credito * REF.cbs / 100, cbs = deb - cr, dif = cbs - rf.pis_cofins_hoje;
  const ref = pnl('Reforma tributária: simulação de 2027', 'CBS no lugar de PIS/COFINS',
    `<div class="cfg-ref"><label>CBS de referência (%)<input type="number" step="0.1" value="${REF.cbs}" onchange="REF.cbs=parseFloat(this.value)||0;desenharEstrategico()"></label>
      <label>IBS de referência (%)<input type="number" step="0.1" value="${REF.ibs}" onchange="REF.ibs=parseFloat(this.value)||0;desenharEstrategico()"></label></div>` +
    tb([['PIS/COFINS hoje (estimado)', brl(rf.pis_cofins_hoje)], ['CBS: débito sobre a receita', brl(deb), 'sub'], ['CBS: crédito das compras do regime regular', brl(cr), 'sub', 'compras do Simples (' + rs(rf.compras_simples) + ') dão crédito só do que o fornecedor recolher'],
      ['= CBS a recolher (estimada)', brl(cbs), 'tot'], ['Diferença para o PIS/COFINS de hoje', `<span style="color:${dif > 0 ? 'var(--erro)' : 'var(--ok)'}">${dif > 0 ? '+' : ''}${brl(dif)}</span>`, 'tot'],
      ['IBS em 2027 (0,1%)', brl(rf.receita_base * 0.001), 'sub'], ['IBS na alíquota cheia, quando ICMS e ISS saírem (2033)', brl(rf.receita_base * REF.ibs / 100), 'sub', 'hoje o ICMS destacado nas vendas é ' + rs(rf.icms_saidas)]]) + prem(rf.premissas));
  // 7. risco
  const rk = e.risco;
  const ris = pnl('Concentração e risco', '', tb([['Maior cliente', rk.top1_cliente ? `${esc(rk.top1_cliente.nome)} · ${pc(rk.top1_cliente.pct)}` : '—'], ['5 maiores clientes', pc(rk.top5_clientes_pct)],
      ['Maior fornecedor', rk.top1_fornecedor ? `${esc(rk.top1_fornecedor.nome)} · ${pc(rk.top1_fornecedor.pct)}` : '—'], ['Compras do Simples', pc(rk.simples_pct_compras)]]) +
    (rk.alertas.length ? `<div class="acoes">${rk.alertas.map(a => `<div><span class="tag alerta">Atenção</span> ${esc(a)}</div>`).join('')}</div>` : ''));
  // 8. operação
  const op = e.operacao, catRot = Object.fromEntries(RES.categorias || []);
  const ope = pnl('Indicadores do fechamento', '', tb([['Documentos (XML)', op.documentos_xml], ['Lançamentos na planilha', op.lancamentos], ['Notas com erro', `${op.notas_com_erro} (${pc(op.taxa_erro)})`],
      ['Apontamentos', op.apontamentos], ['Primeiro arquivo recebido', esc(op.recebido_em || '—')], ['Calculado em', esc(op.calculado_em || '')]]) +
    `<div class="bars">${Object.entries(op.por_categoria).sort((a, b) => b[1] - a[1]).map(([k, v]) => { const mx = Math.max(...Object.values(op.por_categoria)); return `<div class="br" title="${esc(catRot[k] || k)}: ${v}"><div class="bn"><span class="rk-n"></span><span class="nm">${esc(catRot[k] || k)}</span></div><div class="bt"><i style="width:${100 * v / mx}%"></i></div><div class="bv">${v}</div></div>`; }).join('')}</div>`);
  const bar = `<div class="rel-b" style="border:1px solid var(--borda);border-radius:8px;background:#fff;margin-bottom:12px"><span style="flex:1 1 260px;color:var(--suave);font-size:12.5px">Visão estratégica do mês, com evolução, margem, créditos, projeções e riscos.</span>

// ------------------------------------------------------------------ estratégia tributária Matriz × SCP
let SCPR = null, _scpT = null;
async function carregarSCP() { SCPR = await api('/api/scp'); }
async function entrarADM() {
  const st = await api('/api/adm');
  let pin;
  if (!st.configurado) {
    pin = prompt('Crie o PIN do ADM (mínimo 4 dígitos). Só quem tiver o PIN edita a Estratégia SCP.');
    if (!pin) return;
    if (prompt('Repita o PIN') !== pin) { alert('Os PINs não conferem.'); return; }
  } else {
    pin = prompt('PIN do ADM'); if (!pin) return;
  }
  try {
    const r = await api(st.configurado ? '/api/adm/entrar' : '/api/adm/criar', {method: 'POST', body: JSON.stringify({pin})});
    ADM = r.token; try { sessionStorage.setItem('adm_token', ADM); } catch (e) {}
    desenharSCP();
  } catch (e) { alert(e.message); }
}
async function sairADM() { try { await api('/api/adm/sair', {method: 'POST'}); } catch (e) {} ADM = null; try { sessionStorage.removeItem('adm_token'); } catch (e) {} desenharSCP(); }
async function conferirADM() { if (!ADM) return; try { const st = await api('/api/adm'); if (!st.ativo) { ADM = null; try { sessionStorage.removeItem('adm_token'); } catch (e) {} } } catch (e) {} }
function setSCP(o, agora) {
  if (!ADM) { if (confirm('Só o ADM altera a Estratégia SCP. Entrar no modo ADM agora?')) entrarADM(); else desenharSCP(); return; }
  Object.assign(SCPR.cfg, o);
  clearTimeout(_scpT);
  _scpT = setTimeout(async () => { const y = window.scrollY; SCPR = await api('/api/scp', {method: 'POST', body: JSON.stringify({cfg: o})}); await desenharSCP(); window.scrollTo(0, y); if (DET_K) desenharDetalhe(); }, agora ? 0 : 450);
}
async function resetSCP() { if (!ADM) { if (confirm('Só o ADM restaura os parâmetros. Entrar no modo ADM?')) entrarADM(); return; } if (!confirm('Voltar todos os parâmetros da simulação ao padrão? Os dados importados não mudam.')) return; SCPR = await api('/api/scp', {method: 'POST', body: JSON.stringify({reset: true})}); desenharSCP(); }
const nv = v => { if (v === '' || v == null) return null; return nnum(v); };
function memTab(sec, titulo, sub) {
  const ls = (SCPR.memoria || {})[sec] || [];
  return `<div class="painel"><div class="ph">${titulo}${sub ? ` <small>${sub}</small>` : ''}</div><table class="pn-t mem"><thead><tr><th>Linha</th><th class="num">Valor</th><th>Memória de cálculo</th></tr></thead><tbody>
    ${ls.map(l => `<tr class="mt-${l.tipo || ''}"><td>${esc(l.rot)}</td><td class="num">${brl(l.valor)}</td><td class="fx">${esc(l.formula || '')}</td></tr>`).join('')}</tbody></table></div>`;
}
async function desenharSCP() {
  await conferirADM();
  if (!SCPR) await carregarSCP();
  const k = SCPR, c = k.cfg, r = k.resumo, d = r.distribuicao, cm = k.comparativo, f = k.fontes || {};
  const ck = (campo, rot, tip) => `<label class="tg" title="${esc(tip || '')}"><input type="checkbox" ${c[campo] ? 'checked' : ''} onchange="setSCP({${campo}: this.checked}, true)"> ${rot}</label>`;
  const num = (campo, rot, ph, extra) => `<label>${rot}<input type="text" value="${c[campo] == null ? '' : esc(brl(c[campo]))}" placeholder="${esc(ph || '')}" onchange="setSCP(Object.assign({${campo}: nv(this.value)}, ${extra || '{}'}), true)"></label>`;
  // 1. resumo
  const kpi = (cls, rot, v, dsc) => `<div class="kpi ${cls}"><div class="r">${rot}</div><div class="v" style="font-size:19px">${v}</div><div class="d">${dsc}</div></div>`;
  const tot = (cm.estrategia || {}).total || 0;
  const resumo = `<div class="painel kpis scp-kpis">
    ${kpi('neutro', 'Faturamento total', rs(cm.receita), 'produtos + serviços + locação (base)')}
    ${kpi('neutro', 'Créditos disponíveis (Matriz)', rs(r.matriz.creditos), 'PIS + COFINS, com saldo anterior')}
    ${kpi('neutro', 'Débitos estimados (Matriz)', rs(r.matriz.debitos), 'PIS + COFINS antes dos créditos')}
    ${kpi(r.matriz.pis_cofins > 0.005 ? 'alerta' : 'ok', 'Matriz: PIS/COFINS a recolher', rs(r.matriz.pis_cofins), r.matriz.saldo_credor > 0.005 ? 'saldo credor ' + rs(r.matriz.saldo_credor) : 'Lucro Real')}
    ${kpi('neutro', 'SCP: PIS/COFINS + IRPJ/CSLL do mês', rs(r.scp.pis_cofins + r.scp.irpj_csll_mes), 'trimestre: IRPJ/CSLL ' + rs(r.scp.irpj_csll_tri))}
    ${kpi('ok', 'Economia da estratégia', rs(cm.economia_vs_presumido), 'contra tudo no Presumido · ' + rs(cm.economia_vs_real) + ' contra tudo no Real')}</div>`;
  // 2. importação
  const card = (id, rot) => { const st = EST?.cards?.[id] || {qtd: 0}; return `<div class="imp-i ${st.qtd ? 'ok' : ''}"><span>${st.qtd ? '✓' : '○'}</span><div><b>${rot}</b><div class="sb">${st.qtd ? st.qtd + ' arquivo(s)' : 'não enviado'}</div></div></div>`; };
  const sr = RES.servicos_relatorio || {};
  const imp = `<div class="painel"><div class="ph">Importação de relatórios <small>PDF ou Excel, na aba Documentos</small><span style="margin-left:auto"><button class="btn peq" onclick="mostrar('docs')">Enviar relatórios</button></span></div>
    <div class="imp-g">${card('serv_saida', 'Saída de serviços')}${card('serv_entrada', 'Entrada de serviços')}${card('planilha_locacoes', 'Locações')}${card('planilha', 'Planilha do sistema (produtos)')}</div>
    <div class="apu-nota">Serviços prestados: ${f.prestados || 0} nota(s) de ${esc(f.fonte_prestados || 'nenhuma fonte')} · serviços tomados: ${f.tomados || 0} de ${esc(f.fonte_tomados || 'nenhuma fonte')} · locações: ${f.locacoes || 0} lançamento(s).
      ${(sr.alertas || []).length ? '<br>Relatórios de serviço: ' + sr.alertas.slice(0, 5).map(esc).join(' ') : ''}</div>
    <div class="cfg-ref"><label>CNPJ da SCP<input type="text" style="width:170px" value="${esc(c.scp_cnpj || '')}" onchange="setSCP({scp_cnpj: this.value.replace(/\\D/g, '')}, true)"></label>
      <label>Nome da SCP<input type="text" style="width:300px" value="${esc(c.scp_nome || '')}" onchange="setSCP({scp_nome: this.value}, true)"></label>

      ${MAN.map((m, i) => `<tr><td><span class="tag ${m.tipo === 'tomado' ? 'info' : 'ok'}">${m.tipo === 'tomado' ? 'Tomado' : 'Prestado'}</span></td><td><b>${esc(m.numero || '-')}</b></td><td>${esc((m.data || '').split('-').reverse().join('/'))}</td>
        <td>${esc(m.nome || '')}</td><td>${esc(m.cnpj ? cnpjFmt(String(m.cnpj).replace(/\D/g, '')) : '')}</td><td class="num">${brl(+m.valor || 0)}</td>
        <td class="num">${brl((+m.valor || 0) * (+m.aliq_iss || 0) / 100)}${m.iss_retido ? ' <small>retido</small>' : ''}</td><td class="num">${brl(ret(m))}</td>
        <td class="man-a"><button class="lnk" onclick="MAN_ED=Object.assign({},MAN[${i}]);desenharManuais()">editar</button><button class="lnk" style="color:var(--erro)" onclick="excluirManual(${i})">excluir</button></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">${MAN.length} nota(s) · tomados ${brl(tot('tomado'))} · prestados ${brl(tot('prestado'))}</td><td class="num">${brl(tot('tomado') + tot('prestado'))}</td><td colspan="3"></td></tr></tfoot></table>`
      : (ed ? '' : '<div class="vz-p">Nenhuma nota lançada à mão.</div>')}`;
}
async function gravarManuais(txt) {
  MAN = (await api('/api/manuais', {method: 'POST', body: JSON.stringify({notas: MAN})})).notas || [];
  MAN_ED = null; desenharManuais();
  if (RES) { msg(txt + ' Recalculando…'); await calcular(); } else msg(txt + ' Clique em Calcular.');
}
async function salvarManual() {
  const m = MAN_ED;
  if (!(+m.valor > 0)) return alert('Informe o valor do serviço.');
  if (!m.numero) return alert('Informe o número da nota.');
  if (!m.data) return alert('Informe a data de emissão.');
  m.cnpj = String(m.cnpj || '').replace(/\D/g, '');
  if (m.cnpj && m.cnpj.length !== 11 && m.cnpj.length !== 14) return alert('CNPJ/CPF com quantidade de dígitos errada.');
  const i = MAN.findIndex(x => x.id === m.id);
  if (i >= 0) MAN[i] = m; else MAN.push(m);
  await gravarManuais('Nota ' + m.numero + ' salva.');
}
async function excluirManual(i) { if (!confirm('Excluir a nota ' + (MAN[i].numero || '') + ' lançada à mão?')) return; MAN.splice(i, 1); await gravarManuais('Nota excluída.'); }

// ------------------------------------------------------------------ início
(async () => {
  try { PERFIL = await api('/api/perfil'); } catch (e) {}
  if (COLAB()) {   // acesso de colaborador: sem Estratégia SCP nem Visão estratégica
    ['#abaScp', '#abaEst'].forEach(id => { const b = $(id); if (b) b.style.display = 'none'; });
  }
  if (PERFIL.login) {
    const pe = document.querySelector('.side-pe');
    if (pe) pe.insertAdjacentHTML('beforeend', `<button onclick="location.href='/sair'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Sair${PERFIL.usuario ? ' (' + esc(PERFIL.usuario) + ')' : ''}</span></button>`);
  }
  EST = await api('/api/estado'); PL = await api('/api/planilha'); carregarManuais();
  if (EST.config?.cnpj) $('#inCnpj').value = EST.config.cnpj;
  if (EST.config?.competencia) { const [a, m] = EST.config.competencia.split('-'); $('#inComp').value = m + '/' + a; }
  desenharCards();
  COR = await api('/api/corrigidos');
  if (EST.tem_resultado) { RES = await api('/api/resultado'); setTimeout(desenharSituacao, 300); if (RES.notas) { abrirResultado(); mostrar('docs'); } }
})();
</script>
